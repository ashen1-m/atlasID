name: AtlasID CI/CD Pipeline

on:
  push:
    branches: [ main, v2-architecture ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    # Spin up a live Postgres database for Jest tests to use
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: atlasid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Jest Tests
        working-directory: ./backend
        env:
          PORT: 3000
          DB_USER: postgres
          DB_PASSWORD: postgres_password
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: atlasid_test
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # 🔥 CACHE REQUIREMENT REMOVED HERE to stop the crash

      - name: Install Frontend Dependencies
        working-directory: ./clean-wallet
        run: npm ci

      - name: Verify Expo Build Compatibility
        working-directory: ./clean-wallet
        run: npx expo export --platform web